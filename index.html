  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/github-markdown-css/5.5.1/github-markdown-dark.min.css">
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 30px 16px 60px;
      background-color: #070b09;
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      width: 100%;
      max-width: 940px;
    }
    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0d1512;
      border: 1px solid #1f4435;
      border-radius: 10px;
      padding: 14px 22px;
      margin-bottom: 24px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
    }
    .profile-title {
      font-size: 15px;
      color: #84d898;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: 0.5px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      color: #84d898;
      background: #0e241b;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #2d5a43;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .status-badge:hover {
      background: #16382c;
      border-color: #84d898;
      box-shadow: 0 0 12px rgba(132, 216, 152, 0.25);
      color: #d4ffe7;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      background-color: #84d898;
      border-radius: 50%;
      box-shadow: 0 0 8px #84d898;
      animation: pulse 2s infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.2); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
    .github-box {
      border: 1px solid #1f4435;
      border-radius: 12px;
      padding: 36px 28px;
      background: #0a0f0d;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.85);
      position: relative;
      overflow: hidden;
    }
    .github-box::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, #84d898, transparent);
    }
    .markdown-body {
      background-color: transparent !important;
      color: #e6edf3 !important;
      font-size: 15px;
    }
    .markdown-body div[align="center"],
    .markdown-body p[align="center"],
    .markdown-body center {
      text-align: center !important;
    }
    .markdown-body div[align="center"] img,
    .markdown-body p[align="center"] img {
      display: inline-block !important;
      vertical-align: middle !important;
      margin: 4px 2px;
      border-radius: 4px;
      max-width: 100%;
    }
    .markdown-body a {
      color: #84d898 !important;
      text-decoration: none;
    }
    .markdown-body a:hover {
      text-decoration: underline;
    }
    .markdown-body code {
      background-color: #12221b !important;
      color: #84d898 !important;
      border: 1px solid #1f4435;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .footer {
      margin-top: 30px;
      text-align: center;
      font-size: 13px;
      color: #56ab7c;
      opacity: 0.8;
    }
    .footer a {
      color: #84d898;
      text-decoration: none;
    }
    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
